name: Prepare ELBTAL ensemble PNGs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ensembles.yml']
  schedule:
    # Poll hourly; keep serving the last published image until a new cycle is ready.
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Ensemble model
        required: true
        default: GEFS
        type: choice
        options: [GEFS, ECMWF ENS]
      place:
        description: Exact place name (e.g. Mühlberg (Elbe))
        required: true
        default: Mühlberg (Elbe)
      parameters:
        description: Parameter(s), e.g. T850 or "T2 + Niederschlag"
        required: true
        default: T2

permissions:
  contents: write

concurrency:
  group: ensemble-png-publisher
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install GRIB decoder and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          pip install -r requirements.txt
      - name: Generate the latest available ensemble PNGs
        env:
          MODEL: ${{ github.event.inputs.model || 'GEFS' }}
          PLACE: ${{ github.event.inputs.place || 'Mühlberg (Elbe)' }}
          PARAMS: ${{ github.event.inputs.parameters || 'T2' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import shlex
          from ensemble_archive import generate, image_path
          from model_cycles import recent_cycles

          model=os.environ['MODEL']
          place=os.environ['PLACE']
          scheduled=os.environ['EVENT_NAME'] in ('schedule','push')
          # Newest eligible GEFS cycle takes priority. Published +48h files
          # remain visible while the longer +120h product is prepared.
          parameters=['T850','T2'] if scheduled else shlex.split(os.environ['PARAMS'])
          cycles=recent_cycles(model,count=2)
          for index,run in enumerate(cycles):
              horizons=[48,120] if model=='GEFS' and index==0 else [48]
              for horizon in horizons:
                  if horizon==120:
                      # Probe the farthest step before requesting 1,302 GRIB
                      # subregions for a cycle not yet fully published by NOAA.
                      from ensembles import gefs_point, PLACES
                      lat,lon=PLACES[place]
                      try:
                          gefs_point(run,120,0,'t2',lat,lon)
                      except Exception as exc:
                          print(f"NOT YET AVAILABLE {model} {run:%Y%m%d%H} +120h: {exc}")
                          continue
                  for param in parameters:
                      path=image_path(model,place,param,run,horizon)
                      if path.exists():
                          print(f"EXISTS {path}")
                          continue
                      try:
                          published=generate(model,place,run,horizon,param)
                          if not published:
                              print(f"DEFERRED {model} {run:%Y%m%d%H} {param} +{horizon}h")
                      except Exception as exc:
                          print(f"NOT READY {model} {run:%Y%m%d%H} {param} +{horizon}h: {exc}")
          PY
      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ensemble_png
          git add ensemble_png/
          if git diff --cached --quiet; then
            echo "No complete new ensembles available yet"
          else
            git commit -m "data: publish completed ELBTAL ensemble PNGs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Generate newest GEFS +240h (T850, T2, T2 + precipitation)
        if: ${{ (github.event.inputs.model || 'GEFS') == 'GEFS' }}
        env:
          PLACE: ${{ github.event.inputs.place || 'Mühlberg (Elbe)' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Long-range work must not prevent publication of the short-range PNGs.
          # Limit the long-range phase so GitHub still has time to commit its output.
          timeout --signal=TERM --kill-after=30s 75m python - <<'PY' || echo "Long-range build deferred to next scheduled check"
          from ensemble_archive import generate, image_path
          from model_cycles import recent_cycles
          from ensembles import gefs_point, PLACES
          import os

          place=os.environ['PLACE']
          run=recent_cycles('GEFS',count=1)[0]
          lat,lon=PLACES[place]
          horizon=240
          parameters=['T850','T2','T2 + Niederschlag']
          todo=[parameter for parameter in parameters
                if not image_path('GEFS',place,parameter,run,horizon).exists()]
          if not todo:
              print(f"+240h already published for {run:%Y%m%d%H}")
          else:
              # Verify the farthest lead and APCP availability before bulk requests.
              probe_fields=['t2']+(['precip'] if 'T2 + Niederschlag' in todo else [])
              usable=True
              for field in probe_fields:
                  try:
                      gefs_point(run,horizon,0,field,lat,lon)
                  except Exception as exc:
                      print(f"GEFS {run:%Y%m%d%H} +240h {field} not ready: {exc}")
                      usable=False
              if usable:
                  for parameter in todo:
                      try:
                          published=generate('GEFS',place,run,horizon,parameter)
                          if not published:
                              print(f"DEFERRED {parameter} {run:%Y%m%d%H} +240h")
                      except Exception as exc:
                          print(f"NOT READY {parameter} {run:%Y%m%d%H} +240h: {exc}")
          PY
      - name: Publish +240h PNGs without blocking short-range maps
        if: ${{ (github.event.inputs.model || 'GEFS') == 'GEFS' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ensemble_png/
          if git diff --cached --quiet; then
            echo "No new +240h PNG available yet"
          else
            git commit -m "data: publish ELBTAL GEFS +240h ensemble PNGs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
