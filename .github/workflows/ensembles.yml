name: Prepare ELBTAL ensemble PNGs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ensembles.yml']
  schedule:
    # Four daily refreshes; archive viewer keeps serving last published image.
    - cron: '25 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Ensemble model
        required: true
        default: GEFS
        type: choice
        options: [GEFS, ECMWF ENS]
      place:
        description: Exact place name (e.g. Mühlberg (Elbe))
        required: true
        default: Mühlberg (Elbe)
      parameters:
        description: Parameter(s), e.g. T850 or "T2 + Niederschlag"
        required: true
        default: T2

permissions:
  contents: write

concurrency:
  group: ensemble-png-publisher
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install GRIB decoder and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          pip install -r requirements.txt
      - name: Generate the latest available ensemble PNGs
        env:
          MODEL: ${{ github.event.inputs.model || 'GEFS' }}
          PLACE: ${{ github.event.inputs.place || 'Mühlberg (Elbe)' }}
          PARAMS: ${{ github.event.inputs.parameters || 'T2' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import shlex
          from ensemble_archive import generate, image_path
          from model_cycles import recent_cycles

          model=os.environ['MODEL']
          place=os.environ['PLACE']
          scheduled=os.environ['EVENT_NAME'] in ('schedule','push')
          # Publish compact short-range products first. Never block the viewer
          # waiting for every +384h member to be ready.
          parameters=['T850','T2'] if scheduled else shlex.split(os.environ['PARAMS'])
          horizon=48 if scheduled else (48 if model=='GEFS' else 48)
          # Work on most recent eligible cycle first; fall back one cycle
          # if it is not fully published yet.
          for run in recent_cycles(model,count=2):
              for param in parameters:
                  path=image_path(model,place,param,run,horizon)
                  if path.exists():
                      print(f"EXISTS {path}")
                      continue
                  try:
                      generate(model,place,run,horizon,param)
                  except Exception as exc:
                      print(f"NOT READY {model} {run:%Y%m%d%H} {param}: {exc}")
          PY
      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ensemble_png
          git add ensemble_png/
          if git diff --cached --quiet; then
            echo "No complete new ensembles available yet"
          else
            git commit -m "data: publish completed ELBTAL ensemble PNGs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
