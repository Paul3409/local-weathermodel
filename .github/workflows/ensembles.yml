name: Prepare ELBTAL ensemble PNGs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ensembles.yml']
  schedule:
    # Poll hourly; keep serving the last published image until a new cycle is ready.
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Ensemble model
        required: true
        default: GEFS
        type: choice
        options: [GEFS, ECMWF ENS]
      place:
        description: Exact place name (e.g. Mühlberg (Elbe))
        required: true
        default: Mühlberg (Elbe)
      parameters:
        description: Parameter(s), e.g. T850 or "T2 + Niederschlag"
        required: true
        default: T2

permissions:
  contents: write

concurrency:
  group: ensemble-png-publisher
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install GRIB decoder and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          pip install -r requirements.txt
      - name: Re-render GEFS 06 UTC precipitation PNG from saved cache
        if: ${{ github.event_name == 'push' }}
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          import numpy as np
          from ensemble_archive import _cache_file,image_path
          from ensembles import draw,PLACES
          model,place='GEFS','Mühlberg (Elbe)'
          run=datetime(2026,11,17,6,tzinfo=timezone.utc)
          steps=list(range(0,385,6))
          arrays={}
          for field in ('t2','precip'):
              cache=_cache_file(model,place,field,run)
              if not cache.exists():
                  raise RuntimeError(f"Missing cached GEFS data: {cache}")
              with np.load(cache,allow_pickle=False) as saved:
                  known={int(h):j for j,h in enumerate(saved['steps'])}
                  values=saved['data']
                  arrays[field]=np.column_stack([
                      values[:,known[h]] if h in known else np.full(31,np.nan)
                      for h in steps])
              valid=np.isfinite(arrays[field][:,1:]).mean()
              print(f"{field} cached coverage: {valid:.1%}",flush=True)
              if valid<0.85:
                  raise RuntimeError(f"Insufficient cached {field} coverage")
          target=image_path(model,place,'T2 + Niederschlag',run,384)
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(draw(model,place,run,'t2',steps,arrays['t2'],
                                  precip=arrays['precip']))
          print(f"RENDERED {target}",flush=True)
          PY
      - name: Generate the latest available ensemble PNGs
        env:
          MODEL: ${{ github.event.inputs.model || 'GEFS' }}
          PLACE: ${{ github.event.inputs.place || 'Mühlberg (Elbe)' }}
          PARAMS: ${{ github.event.inputs.parameters || 'T2' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import shlex
          from ensemble_archive import generate, image_path
          from model_cycles import recent_cycles

          model=os.environ['MODEL']
          place=os.environ['PLACE']
          scheduled=os.environ['EVENT_NAME'] in ('schedule','push')
          # Newest eligible GEFS cycle takes priority. Publish short-range
          # previews before the expensive +240h/+384h background stage.
          parameters=['T850','T2'] if scheduled else shlex.split(os.environ['PARAMS'])
          cycles=recent_cycles(model,count=2)
          for index,run in enumerate(cycles):
              horizons=[48,120] if model=='GEFS' and index==0 else [48]
              for horizon in horizons:
                  if horizon==120:
                      # Probe the farthest step before requesting 1,302 GRIB
                      # subregions for a cycle not yet fully published by NOAA.
                      from ensembles import gefs_point, PLACES
                      lat,lon=PLACES[place]
                      try:
                          gefs_point(run,120,0,'t2',lat,lon)
                      except Exception as exc:
                          print(f"NOT YET AVAILABLE {model} {run:%Y%m%d%H} +120h: {exc}")
                          continue
                  for param in parameters:
                      path=image_path(model,place,param,run,horizon)
                      if path.exists():
                          print(f"EXISTS {path}")
                          continue
                      try:
                          published=generate(model,place,run,horizon,param)
                          if not published:
                              print(f"DEFERRED {model} {run:%Y%m%d%H} {param} +{horizon}h")
                      except Exception as exc:
                          print(f"NOT READY {model} {run:%Y%m%d%H} {param} +{horizon}h: {exc}")
          PY
      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ensemble_png
          git add ensemble_png/
          if git diff --cached --quiet; then
            echo "No complete new ensembles available yet"
          else
            git commit -m "data: publish completed ELBTAL ensemble PNGs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build latest GEFS +240h and +384h incrementally
        if: ${{ (github.event.inputs.model || 'GEFS') == 'GEFS' }}
        env:
          PLACE: ${{ github.event.inputs.place || 'Mühlberg (Elbe)' }}
        run: |
          # Hourly follow-up reuses cached GEFS member values from the last
          # worker. The short-range graphics were published in the step above.
          timeout --signal=TERM --kill-after=30s 100m python - <<'PY' || echo "Long-range continuation deferred to next hourly run"
          from ensemble_archive import generate, image_path
          from model_cycles import recent_cycles
          from ensembles import gefs_point, PLACES

          model='GEFS'
          place='Mühlberg (Elbe)'
          run=recent_cycles(model,count=1)[0]
          lat,lon=PLACES[place]
          # First extend the three existing products to +240h. Then build
          # the full +384h set, including snow-depth increments and MSLP.
          stages=[
              (240,['T850','T2','T2 + Niederschlag']),
              (384,['T850','T2','T2 + Niederschlag','Neuschnee','MSLP']),
          ]
          for horizon,parameters in stages:
              missing=[p for p in parameters
                       if not image_path(model,place,p,run,horizon).exists()]
              if not missing:
                  print(f"ALL READY {run:%Y%m%d%H} +{horizon}h",flush=True)
                  continue
              try:
                  # A single valid control member is a cheap availability
                  # probe, not a claim that all ensemble members exist.
                  gefs_point(run,horizon,0,'t2',lat,lon)
              except Exception as exc:
                  print(f"NOT YET AVAILABLE {run:%Y%m%d%H} +{horizon}h: {exc}",flush=True)
                  continue
              for param in missing:
                  try:
                      result=generate(model,place,run,horizon,param)
                      print(f"{'READY' if result else 'DEFERRED'} {run:%Y%m%d%H} +{horizon}h {param}",flush=True)
                  except Exception as exc:
                      print(f"NOT READY {run:%Y%m%d%H} +{horizon}h {param}: {exc}",flush=True)
          PY
      - name: Publish long-range graphics and reusable GEFS point cache
        if: ${{ (github.event.inputs.model || 'GEFS') == 'GEFS' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ensemble_png ensemble_cache
          git add ensemble_png/ ensemble_cache/
          if git diff --cached --quiet; then
            echo "No newly available +240h/+384h data"
          else
            git commit -m "data: publish GEFS long-range ensembles and point cache"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
