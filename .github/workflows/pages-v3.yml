name: MeteoOST V3 Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '45 * * * *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_pages.py
      - name: Install ICON-D2 dependencies
        run: pip install numpy scipy matplotlib requests eccodes cartopy
      - name: Generate ICON-D2 maps
        run: python scripts/build_icon_d2.py
      - name: Verify ICON-D2 products
        run: python -c "import json,pathlib; p=pathlib.Path('_site'); d=json.loads((p/'icon-d2/index.json').read_text()); assert len(d['products']) >= 25; assert all((p/x['path']).stat().st_size > 1000 for x in d['products'])"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
