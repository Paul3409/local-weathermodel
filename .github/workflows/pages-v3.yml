name: MeteoOST V3 Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '45 * * * *'
concurrency:
  group: meteoost-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'ensemble') }}
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_pages.py
      - name: Restore latest compatible weather products
        id: weather
        uses: actions/cache/restore@v4
        with:
          path: _site/icon-d2
          key: icon-d2-${{ hashFiles('scripts/build_icon_d2.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            icon-d2-${{ hashFiles('scripts/build_icon_d2.py') }}-
      - name: Install ICON-D2 dependencies
        if: steps.weather.outputs.cache-matched-key == '' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pip install numpy scipy matplotlib requests eccodes cartopy
      - name: Generate ICON-D2 maps
        timeout-minutes: 12
        if: steps.weather.outputs.cache-matched-key == '' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/build_icon_d2.py
      - name: Verify ICON-D2 products
        run: python -c "import json,pathlib; p=pathlib.Path('_site'); d=json.loads((p/'icon-d2/index.json').read_text()); assert all(sum(x.get('param') == k for x in d['products']) >= 24 for k in ('t2','gust','precip','rate','snow')); assert all((p/x['path']).stat().st_size > 1000 for x in d['products'])"
      - name: Save verified weather products
        if: steps.weather.outputs.cache-matched-key == '' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: _site/icon-d2
          key: icon-d2-${{ hashFiles('scripts/build_icon_d2.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
