name: MeteoOST V2 version policy
on:
  push:
    branches: [version-bump-manual-only]
    paths-ignore:
      - 'app_version.py'
      - '.github/workflows/**'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Calculate next version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("app_version.py")
          contents = path.read_text()
          match = re.search(r'VERSION\s*=\s*["\'](\d+)\.(\d+)\.(\d+)["\']', contents)
          if not match:
              raise SystemExit("Missing VERSION in app_version.py")
          major, minor, patch = map(int, match.groups())
          message = os.environ.get("COMMIT_MESSAGE", "").lower()
          if "[major]" in message or "breaking change:" in message:
              major, minor, patch = major + 1, 0, 0
          elif "[minor]" in message or "feat:" in message:
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new_version = f"{major}.{minor}.{patch}"
          path.write_text(f'"""Central ELBTAL application release version. Managed by the version workflow."""\nVERSION = "{new_version}"\n')
          print("New version:", new_version)
          PY
      - name: Commit version change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_version.py
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump ELBTAL version [skip ci]"
            git push
          fi
